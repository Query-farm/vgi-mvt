[project]
name = "vgi-mvt-worker"
version = "0.4.0"
description = "Decode Mapbox Vector Tiles (PMTiles, MBTiles, XYZ, .mvt) into DuckDB tables with GEOMETRY columns"
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # [http] adds the HTTP transport (`--http`) used by Docker deploys.
    # SDK bumps go through the template (minor bumps can raise the protocol).
    # [haybarn] embeds the engine the SDK uses to apply filters DuckDB pushes into
    # read_tiles (filter_pushdown, needed for the spatial bounding-box hint).
    "vgi-python[http,haybarn]>=0.55.1,<0.56",
    # PMTiles v3 header/directory codec (pure Python, BSD-3-Clause).
    "pmtiles>=3.4",
    # GEOS clipping and union to join a feature's pieces across tile edges (BSD-3-Clause).
    "shapely>=2.0",
]

[project.optional-dependencies]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`):
# `http` so the container can serve `--http` (/health + VGI RPC), plus `oauth`
# (JWT verification) so the image can run in Orchard hosted mode
# (`VGI_ORCHARD_HOSTED=1` with VGI_JWT_ISSUER/AUDIENCE/JWKS_URI and VGI_SIGNING_KEY).
serve = [
    "vgi-python[http,oauth]>=0.55.1,<0.56",
]

[project.scripts]
vgi-mvt-worker = "mvt_worker.worker:main"

[dependency-groups]
dev = [
    # The pushdown recipe evaluates predicates locally; a worker that uses filter
    # pushdown must add the `haybarn` extra to its own dependencies.
    "vgi-python[haybarn]>=0.55.1,<0.56",
    "pytest>=8.4",
    "mypy>=1.18",
    "ruff>=0.14",
    "pyarrow-stubs>=20.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvt_worker"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
# RUF012: the SDK declares metadata as plain class attributes on `class Meta`.
ignore = ["D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"test/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["vgi.*", "vgi_rpc.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pmtiles.*", "shapely.*"]
ignore_missing_imports = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
skip-checking-short-docstrings = true

[tool.pytest.ini_options]
testpaths = ["tests"]
